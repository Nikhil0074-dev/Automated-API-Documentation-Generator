<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} {{version}} - Code examples</title>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--muted:#5b6670;--line:#d8dee4;--accent:#0b6bcb;--card:#f6f8fa}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--fg:#e6edf3;--muted:#9aa7b2;--line:#2b333c;--accent:#58a6ff;--card:#161b22}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card)}
nav strong{margin-right:auto}nav a{color:var(--accent);text-decoration:none}nav a:hover{text-decoration:underline}
main{max-width:1000px;margin:0 auto;padding:20px}

section{margin:0 0 28px}h2{margin:0 0 4px;font-size:18px}
.method{display:inline-block;min-width:64px;padding:1px 8px;border-radius:4px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;text-align:center}
.sub{color:var(--muted);margin:0 0 8px}
details{border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--card)}
summary{cursor:pointer;padding:6px 12px;font-weight:600}
pre{margin:0;padding:12px;overflow-x:auto;border-top:1px solid var(--line);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<nav>
  <strong>{{title}} &middot; {{version}} (API {{api_version}})</strong>
  <a href="index.html">Swagger UI</a>
  <a href="redoc.html">ReDoc</a>
  <a href="examples.html">Code examples</a>
  <a href="changes.html">Changes</a>
  <a href="{{root}}">All versions</a>
</nav>
<main>
<h1>Code examples</h1>
<p class="sub">Examples use placeholder credentials. Replace <code>YOUR_API_KEY</code> with a real key from a secure source.</p>
{{sections}}
</main>
</body>
</html>
